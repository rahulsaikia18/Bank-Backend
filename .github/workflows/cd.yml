name: CD — Build & Push Docker Image

on:
  push:
    branches: ["main"]   # Only deploy from main

# One deployment at a time
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # Never cancel a deployment mid-flight

jobs:
  # ── Prerequisite: CI must pass first ─────────────────────────────────────────
  # The CD workflow only runs after the CI workflow succeeds.
  # This is enforced by triggering CD only on main pushes, which CI gates via
  # branch protection rules (CI required status check before merge).

  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    # Required permissions for OIDC-based registry login (if using GitHub Packages)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Docker image metadata ──────────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Push to GitHub Container Registry (GHCR) ───────────────────────────
      # Secrets required:
      #   GHCR uses GITHUB_TOKEN automatically (no manual secret needed).
      #   For DockerHub, add DOCKERHUB_USERNAME + DOCKERHUB_TOKEN as repo secrets
      #   and replace the login/image steps accordingly.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Optional: Deploy to server ─────────────────────────────────────────
      # Uncomment and configure to SSH-deploy to your VPS/EC2/GCP instance.
      # Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
      #
      # - name: Deploy to production server
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
