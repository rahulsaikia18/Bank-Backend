# ─── HorizontalPodAutoscaler ──────────────────────────────────────────────────
#
# Automatically scales the number of bank-api pods based on CPU and memory.
#
# How it works:
#   The K8s metrics-server watches CPU/memory usage across all pods.
#   If average CPU > 70%  → scale up (add pods, up to maxReplicas)
#   If average CPU < 70%  → scale down (remove pods, down to minReplicas)
#
# Prerequisites:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bank-api-hpa
  namespace: default
  labels:
    app: bank-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bank-api

  # Always maintain at least 2 pods for high availability
  minReplicas: 2

  # Maximum pods before you need to investigate vertical scaling
  maxReplicas: 10

  metrics:
    # Scale up when average CPU across all pods exceeds 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Scale up when average memory across all pods exceeds 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      # Scale up quickly when traffic spikes (banking traffic is bursty)
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2          # Add up to 2 pods at a time
          periodSeconds: 60
    scaleDown:
      # Scale down slowly to avoid thrashing
      stabilizationWindowSeconds: 300  # Wait 5 minutes of calm before scaling down
      policies:
        - type: Pods
          value: 1          # Remove only 1 pod at a time
          periodSeconds: 120
