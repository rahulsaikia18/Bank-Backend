# ─── Secret: sensitive runtime values ────────────────────────────────────────
#
# !! NEVER commit real secrets to git !!
#
# These are base64-encoded PLACEHOLDER values shown for structure only.
# In production, use one of these approaches instead:
#
#   Option A — Sealed Secrets (recommended for GitOps):
#     brew install kubeseal
#     kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#     git add sealed-secret.yaml  ← safe to commit
#
#   Option B — External Secrets Operator + AWS Secrets Manager / Vault:
#     ExternalSecret CR pulls real values at deploy time from the vault.
#
#   Option C — kubectl apply directly (never stored in repo):
#     kubectl create secret generic bank-api-secret \
#       --from-literal=JWT_SECRET='your-real-secret' \
#       --from-literal=MONGO_URI='mongodb+srv://...' \
#       --from-literal=REDIS_URL='redis://:pass@host:6379'
#
# How to encode a placeholder: echo -n "replace_me" | base64
#   → cmVwbGFjZV9tZQ==
#
apiVersion: v1
kind: Secret
metadata:
  name: bank-api-secret
  namespace: default
  labels:
    app: bank-api
type: Opaque
data:
  # echo -n "replace_with_a_strong_32_plus_char_secret" | base64
  JWT_SECRET: cmVwbGFjZV93aXRoX2Ffc3Ryb25nXzMyX3BsdXNfY2hhcl9zZWNyZXQ=

  # echo -n "mongodb+srv://user:password@cluster.mongodb.net/bankdb" | base64
  MONGO_URI: bW9uZ29kYitzcnY6Ly91c2VyOnBhc3N3b3JkQGNsdXN0ZXIubW9uZ29kYi5uZXQvYmFua2Ri

  # echo -n "redis://:redispassword@redis-service:6379" | base64
  REDIS_URL: cmVkaXM6Ly86cmVkaXNwYXNzd29yZEByZWRpcy1zZXJ2aWNlOjYzNzk=

  # echo -n "smtp.example.com" | base64
  EMAIL_HOST: c210cC5leGFtcGxlLmNvbQ==

  # echo -n "your@email.com" | base64
  EMAIL_USER: eW91ckBlbWFpbC5jb20=

