# ─── Deployment: run the Bank API pods ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: default
  labels:
    app: bank-api
spec:
  # Start with 2 replicas — HPA will scale this up/down automatically
  replicas: 2

  selector:
    matchLabels:
      app: bank-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # At most 1 pod unavailable during rollout → zero downtime deploys
      maxUnavailable: 1
      # Spin up 1 extra pod before removing old ones
      maxSurge: 1

  template:
    metadata:
      labels:
        app: bank-api
    spec:
      # Graceful shutdown: give the app 30s to drain connections
      terminationGracePeriodSeconds: 30

      containers:
        - name: bank-api
          # Updated automatically by CD workflow via :sha-<commit> or :latest
          image: ghcr.io/your-org/bank-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http

          # ── Environment ───────────────────────────────────────────────────
          envFrom:
            # Non-sensitive config from ConfigMap
            - configMapRef:
                name: bank-api-config
            # Sensitive values from Secret
            - secretRef:
                name: bank-api-secret

          # ── Resource management ───────────────────────────────────────────
          # requests: guaranteed allocation for scheduling
          # limits:   hard cap — container is killed if exceeded
          resources:
            requests:
              cpu: "100m"      # 0.1 CPU core
              memory: "128Mi"
            limits:
              cpu: "500m"      # 0.5 CPU core
              memory: "512Mi"

          # ── Liveness Probe → /health/live ─────────────────────────────────
          # Question: "Is the process alive?"
          # Action on failure: RESTART the container.
          # Only checks the Node.js process itself — NOT DB or Redis.
          # If it fails 3 times × 20s apart → container is restarted.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 15   # Wait for app to boot before first check
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5

          # ── Readiness Probe → /health/ready ───────────────────────────────
          # Question: "Can this pod receive traffic right now?"
          # Action on failure: REMOVE from Service load balancer (no restart).
          # Checks DB + Redis. If either is down, pod gets zero traffic
          # until dependencies recover — preventing cascading 500 errors.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
